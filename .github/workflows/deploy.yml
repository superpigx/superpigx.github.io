name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.157.0
      THEME_VERSION: v4.0.3
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 云端拉取指定版本的 Stack 主题（不依赖本地 submodule）
      - name: Fetch theme
        run: |
          git clone --depth 1 --branch ${THEME_VERSION} https://github.com/CaiJimmy/hugo-theme-stack.git themes/hugo-theme-stack

      # 修复：Hugo 0.157 中 Language 对象移除了 Locale / Direction 字段
      - name: Patch theme for Hugo 0.157
        run: |
          # .Site.Language.Locale -> .Language.Lang
          grep -rl -- 'Site.Language.Locale' themes/hugo-theme-stack/layouts | while read f; do
            sed -i 's/\.Site\.Language\.Locale/.Language.Lang/g' "$f"
          done
          # .Language.Direction -> 字面量 "ltr"（中文站点方向为从左至右）
          grep -rl -- '.Language.Direction' themes/hugo-theme-stack/layouts | while read f; do
            sed -i 's/\.Language\.Direction/"ltr"/g' "$f"
          done

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo
        run: |
          hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

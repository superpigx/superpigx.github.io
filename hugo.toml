baseURL = "https://superpigx.github.io/"
languageCode = "zh-CN"
title = "我的博客"
theme = "PaperMod"

# 摘要长度
summaryLength = 30

# 分页
paginate = 5

# 默认主题：dark / light / auto
[params]
  title = "我的博客"
  description = "记录技术与生活的个人博客"
  # 默认暗色模式
  defaultTheme = "auto"
  # 显示目录
  ShowToc = true
  TocOpen = false
  # 文章显示阅读时长、字数
  ShowReadingTime = true
  ShowWordCount = true
  # 显示分享按钮
  ShowShareButtons = true
  # 代码块复制按钮
  disableSpecialDisqus = true

  [params.homeInfoParams]
    Title = "我的博客"
    Content = "欢迎来到我的博客，这里记录我的技术学习与生活中的一些思考。"

  [params.social]
    GitHub = "https://github.com/superpigx"

# 顶部菜单
[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 1

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 2

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    guessSyntax = true
